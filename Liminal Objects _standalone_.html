  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<title>From Stable to Liminal — Xuebei Hu<\u002Ftitle>\n\n<script src=\"ac698be6-078e-46e2-8cdf-60bc7bcc467e\"><\u002Fscript>\n<script src=\"93fe245d-4b4e-4649-8add-a36414cabccc\"><\u002Fscript>\n<script src=\"451d6bad-2c06-4ae8-a6a1-e376cba391dc\"><\u002Fscript>\n<script src=\"aabbf4da-2abe-4122-b556-e9198088a4ca\"><\u002Fscript>\n<style>\n/* ═══════════════════════════════════════════════════════\n   DESIGN SYSTEM — Archival / Intelligence Dossier\n   Background: deep teal-navy (\"archive\") + warm parchment accent\n   All text: Times New Roman · ≥ 28px\n═══════════════════════════════════════════════════════ */\n:root {\n  --bg:      #1b2e38;   /* deep archival teal-navy */\n  --bg2:     #243d49;\n  --bg3:     #2f4e5b;\n  --panel:   #f2ecd8;   /* warm archival paper */\n  --panel2:  #e3dcc4;\n  --ink:     #14222b;\n  --muted:   #5a7684;\n  --signal:  #d84527;   /* vivid red signal */\n  --signal2: #ff6b47;\n  --amber:   #e0a83a;\n  --gold:    #c99d3a;\n  --soft:    rgba(242,236,216,0.78);\n  --line:    rgba(242,236,216,0.18);\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml, body { height: 100%; background: #000; overflow: hidden;\n  font-family: 'Times New Roman', Times, serif; }\nbody { color: var(--panel); }\n\ndeck-stage > section {\n  width: 1920px; height: 1080px;\n  position: relative; overflow: hidden;\n  font-family: 'Times New Roman', Times, serif;\n  font-size: 32px;\n  background: var(--bg);\n  color: var(--panel);\n}\n\n/* Every section shares an archival grain + topo wash */\n.bg-layer {\n  position: absolute; inset: 0; z-index: 0; pointer-events: none;\n  background:\n    repeating-radial-gradient(circle at 85% 20%, transparent 0, transparent 60px, rgba(242,236,216,0.045) 61px, transparent 63px),\n    repeating-radial-gradient(circle at 20% 85%, transparent 0, transparent 48px, rgba(242,236,216,0.03) 49px, transparent 51px),\n    linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);\n}\n.bg-layer::after {\n  content: ''; position: absolute; inset: 0;\n  background-image:\n    linear-gradient(rgba(242,236,216,0.04) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(242,236,216,0.04) 1px, transparent 1px);\n  background-size: 80px 80px;\n}\n\n/* ─── Utility ─── */\n.redline {\n  font-size: 28px; font-style: italic;\n  letter-spacing: 0.15em; text-transform: uppercase; color: var(--signal);\n  display: flex; align-items: center; gap: 18px; font-weight: 700;\n}\n.redline::before { content: ''; width: 64px; height: 3px; background: var(--signal); }\n\n.corner {\n  position: absolute; font-size: 24px; letter-spacing: 0.1em; opacity: 0.45;\n  z-index: 10; font-style: italic;\n}\n.corner.tl { top: 34px; left: 40px; }\n.corner.br { bottom: 34px; right: 40px; }\n\n.foot {\n  position: absolute; bottom: 34px; left: 40px; right: 40px;\n  display: flex; justify-content: space-between; align-items: center;\n  font-size: 24px; letter-spacing: 0.1em; opacity: 0.55;\n  z-index: 10; pointer-events: none; font-style: italic;\n}\n\n/* ═══ ANIMATIONS ═══ */\n@keyframes riseIn { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }\n@keyframes drawWidth { from { transform: scaleX(0); } to { transform: scaleX(1); } }\n@keyframes barGrow { from { width: 0; } to { width: var(--w, 100%); } }\n@keyframes blinkFast { 0%, 45% { opacity: 1; } 50%, 100% { opacity: 0.2; } }\n@keyframes pulseBg {\n  0%, 100% { background-color: transparent; box-shadow: none; }\n  8%, 12%  { background-color: rgba(216,69,39,0.22); box-shadow: inset 0 0 180px rgba(216,69,39,0.45), 0 0 100px rgba(216,69,39,0.4); }\n  20%      { background-color: transparent; box-shadow: none; }\n  50%, 52% { background-color: rgba(216,69,39,0.18); box-shadow: inset 0 0 140px rgba(216,69,39,0.35); }\n  60%      { background-color: transparent; box-shadow: none; }\n}\n@keyframes pulseVignette {\n  0%, 100% { opacity: 0; }\n  6%, 14%  { opacity: 1; }\n  20%      { opacity: 0; }\n  48%, 54% { opacity: 0.8; }\n  62%      { opacity: 0; }\n}\n@keyframes redCast {\n  0%, 100% { background: transparent; }\n  8%, 12%  { background: rgba(216,69,39,0.12); }\n  50%, 52% { background: rgba(216,69,39,0.08); }\n}\n@keyframes scanSweep {\n  0%   { transform: translateY(-80px); opacity: 0; }\n  8%   { opacity: 1; }\n  92%  { opacity: 1; }\n  100% { transform: translateY(1180px); opacity: 0; }\n}\n@keyframes expandScale { from { transform: scale(0.5) rotate(-10deg); opacity: 0; } to { transform: scale(1) rotate(-6deg); opacity: 1; } }\n@keyframes numCount { from { transform: translateY(-20px); opacity: 0; } to { transform: none; opacity: 1; } }\n\n/* Thick scan line — visible */\n.scanline {\n  position: absolute; left: 0; right: 0; height: 10px;\n  background: linear-gradient(180deg,\n    transparent 0%,\n    rgba(216,69,39,0.0) 10%,\n    rgba(216,69,39,0.55) 30%,\n    rgba(255,107,71,0.95) 50%,\n    rgba(216,69,39,0.55) 70%,\n    rgba(216,69,39,0.0) 90%,\n    transparent 100%);\n  box-shadow: 0 0 30px rgba(216,69,39,0.7), 0 0 60px rgba(216,69,39,0.35);\n  animation: scanSweep 9s linear infinite;\n  pointer-events: none; z-index: 15;\n}\n\n/* ═══════════════════════════════════════════════════════\n   SLIDE 1 — TITLE (pulsing red flash)\n═══════════════════════════════════════════════════════ */\n.s1 {\n  background: var(--bg);\n  position: relative;\n  display: grid; grid-template-columns: 1050px 1fr;\n}\n.s1-pulse {\n  position: absolute; inset: 0; z-index: 2; pointer-events: none;\n  animation: pulseBg 4.5s ease-in-out infinite;\n}\n.s1-vignette {\n  position: absolute; inset: 0; z-index: 3; pointer-events: none;\n  background: radial-gradient(ellipse at center, transparent 35%, rgba(216,69,39,0.35) 75%, rgba(216,69,39,0.7) 100%);\n  animation: pulseVignette 4.5s ease-in-out infinite;\n}\n.s1-topo {\n  position: absolute; inset: 0; opacity: 0.4;\n  background:\n    repeating-radial-gradient(circle at 30% 60%, transparent 0, transparent 56px, rgba(242,236,216,0.2) 57px, transparent 59px),\n    repeating-radial-gradient(circle at 70% 30%, transparent 0, transparent 42px, rgba(242,236,216,0.15) 43px, transparent 45px);\n}\n.s1-left {\n  position: relative; z-index: 4;\n  background: var(--panel);\n  padding: 80px 100px 70px;\n  clip-path: polygon(0 0, 100% 0, calc(100% - 70px) 100%, 0 100%);\n  display: flex; flex-direction: column; justify-content: center;\n  color: var(--ink);\n}\n.s1-left::before {\n  content: ''; position: absolute; inset: 0; pointer-events: none;\n  background: repeating-radial-gradient(circle at 80% 20%, transparent 0, transparent 40px, rgba(20,34,43,0.05) 41px, transparent 43px);\n}\n.s1-stamp {\n  align-self: flex-start;\n  font-size: 26px;\n  padding: 14px 22px; border: 3px solid var(--signal); color: var(--signal);\n  letter-spacing: 0.3em; margin-bottom: 40px;\n  transform: rotate(-1.2deg); font-style: italic; font-weight: 700;\n  animation: riseIn 0.8s ease both;\n}\n.s1-title {\n  font-size: 150px; line-height: 0.88;\n  color: var(--ink); letter-spacing: -0.01em;\n  margin-bottom: 32px; font-weight: 700;\n  position: relative;\n}\n.s1-title .row { display: block; animation: riseIn 0.9s ease both; }\n.s1-title .row:nth-child(2) { animation-delay: 0.15s; }\n.s1-title .row:nth-child(3) { animation-delay: 0.3s; }\n.s1-title .row:nth-child(4) { animation-delay: 0.45s; }\n.s1-title .red { color: var(--signal); font-style: italic; }\n.s1-sub {\n  font-size: 38px; line-height: 1.22; color: var(--bg);\n  border-left: 5px solid var(--signal);\n  padding-left: 24px; margin-bottom: 44px; font-style: italic;\n  animation: riseIn 0.9s ease 0.6s both;\n}\n.s1-divider { height: 2px; background: var(--ink); opacity: 0.25; margin-bottom: 32px; }\n.s1-author {\n  font-size: 28px;\n  letter-spacing: 0.08em; color: var(--ink);\n  animation: riseIn 0.9s ease 0.75s both;\n  line-height: 1.3; font-weight: 700;\n}\n.s1-author .affil { display: block; font-weight: 400; font-style: itali <div class=\"s1-vignette\"><\u002Fdiv>\n\n  <div class=\"s1-left\">\n    <div class=\"s1-stamp\">DOCTORAL · THEORY PAPER<\u002Fdiv>\n    <div class=\"s1-title\">\n      <span class=\"row\">FROM<\u002Fspan>\n      <span class=\"row\"><span class=\"red\">STABLE<\u002Fspan><\u002Fspan>\n      <span class=\"row\">TO<\u002Fspan>\n      <span class=\"row\"><span class=\"red\">LIMINAL<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"s1-sub\">Reconsidering Legitimation<br>in Fentanyl Governance<\u002Fdiv>\n    <div class=\"s1-divider\"><\u002Fdiv>\n    <div class=\"s1-author\">\n      XUEBEI HU\n      <span class=\"affil\">Georgia State University &nbsp;·&nbsp; Department of Communication<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"s1-right\">\n    <div class=\"crosshair\" style=\"top:18%; left:22%; color: var(--signal);\"><div class=\"dot\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"crosshair\" style=\"top:48%; left:58%; color: var(--amber);\"><div class=\"dot\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"crosshair\" style=\"top:72%; left:30%; color: var(--signal);\"><div class=\"dot\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"crosshair\" style=\"top:28%; left:76%; color: var(--signal);\"><div class=\"dot\"><\u002Fdiv><\u002Fdiv>\n\n    <div class=\"s1-tag\" style=\"top:12%; left:10%;\">N 23.6° · W 102.5°<\u002Fdiv>\n    <div class=\"s1-tag\" style=\"top:44%; left:64%;\">N 32.5° · E 105.3°<\u002Fdiv>\n    <div class=\"s1-tag\" style=\"top:68%; left:36%;\">N 38.9° · W 77.0°<\u002Fdiv>\n    <div class=\"s1-tag\" style=\"top:86%; left:48%;\">2013  ——  2025<\u002Fdiv>\n\n    <div class=\"s1-stamp-big\" style=\"bottom: 160px; right: 100px;\">CLASSIFIED<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"scanline\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════ S2: CRISIS NUMBERS ═══════ -->\n<section class=\"s2\" data-screen-label=\"02 The Crisis\">\n  <div class=\"bg-layer\"><\u002Fdiv>\n  <div class=\"s2-head\">\n    <div class=\"redline\">The Crisis · 2013 — 2025<\u002Fdiv>\n    <div class=\"s2-title\">THREE FACTS<br>THAT <span class=\"red\">CHANGED<\u002Fspan> EVERYTHING<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"s2-nums\">\n    <div class=\"s2-num\">\n      <div class=\"s2-num-idx\">FACT · 01<\u002Fdiv>\n      <div class=\"s2-num-big\">~75<span class=\"unit\">K<\u002Fspan><\u002Fdiv>\n      <div class=\"s2-num-lbl\">Synthetic opioid<br>deaths / year<\u002Fdiv>\n      <div class=\"s2-num-note\">CDC · 2023 · Third Wave<\u002Fdiv>\n      <div class=\"s2-num-bg\">01<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"s2-num\">\n      <div class=\"s2-num-idx\">FACT · 02<\u002Fdiv>\n      <div class=\"s2-num-big\">10×<\u002Fdiv>\n      <div class=\"s2-num-lbl\">Rise in logistics<br>terminology<\u002Fdiv>\n      <div class=\"s2-num-note\">28 → 275 per 10K words<\u002Fdiv>\n      <div class=\"s2-num-bg\">02<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"s2-num\">\n      <div class=\"s2-num-idx\">FACT · 03<\u002Fdiv>\n      <div class=\"s2-num-big\">3,536<\u002Fdiv>\n      <div class=\"s2-num-lbl\">Concordance lines<br>analyzed<\u002Fdiv>\n      <div class=\"s2-num-note\">WH · Congress · DEA<\u002Fdiv>\n      <div class=\"s2-num-bg\">03<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"foot\"><span>Xuebei Hu · GSU<\u002Fspan><span>02 / 09<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════ S3: PARADIGM SHIFT ═══════ -->\n<section class=\"s3\" data-screen-label=\"03 Paradigm Shift\">\n  <div class=\"bg-layer\"><\u002Fdiv>\n  <div class=\"s3-head\">\n    <div class=\"redline\">The Paradigm Shift<\u002Fdiv>\n    <div class=\"s3-title\">NOT PEOPLE.<br><span class=\"red\">PIPELINES.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"s3-body\">\n    <div class=\"s3-col old\">\n      <div class=\"s3-col-tag\">OLD FRAMING<\u002Fdiv>\n      <div class=\"s3-col-h\">Individual<br>Addiction<\u002Fdiv>\n      <div class=\"s3-col-words\">\n        <span class=\"s3-word\">patient<\u002Fspan>\n        <span class=\"s3-word\">prescription< s=\"s4-rq rq2\">\n      <div class=\"s4-num\">02<\u002Fdiv>\n      <div class=\"s4-body\">\n        <div class=\"s4-lbl\">DISCURSIVE · OPERATIONS<\u002Fdiv>\n        <div class=\"s4-text\">Through what <b>discursive operations<\u002Fb> does official discourse <b>assemble<\u002Fb> logistics infrastructure into a governable object — and how does this work <em>do<\u002Fem> legitimation?<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"foot\"><span>Xuebei Hu · GSU<\u002Fspan><span>04 / 09<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════ S5: METHOD — simplified ═══════ -->\n<section class=\"s5\" data-screen-label=\"05 Method\">\n  <div class=\"bg-layer\"><\u002Fdiv>\n  <div class=\"redline\">Method · CADS<\u002Fdiv>\n  <div class=\"s5-title\">CORPUS—ASSISTED<br><span class=\"red\">DISCOURSE STUDIES<\u002Fspan><\u002Fdiv>\n  <div class=\"s5-flow\">\n    <div class=\"s5-step\">\n      <div class=\"s5-step-tag\">LEVEL · 01<\u002Fdiv>\n      <div class=\"s5-step-h\">Diachronic<br>Corpus Analysis<\u002Fdiv>\n      <div class=\"s5-step-meta\">\n        <span class=\"k\">AntConc 4.3.1<\u002Fspan><br>\n        <span class=\"k\">13<\u002Fspan> years · <span class=\"k\">per 10K<\u002Fspan> words\n      <\u002Fdiv>\n      <div class=\"s5-step-out\">→ ANSWERS RQ 1<\u002Fdiv>\n      <div class=\"s5-step-n\">01<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"s5-arrow\">→<\u002Fdiv>\n    <div class=\"s5-step\">\n      <div class=\"s5-step-tag\">LEVEL · 02<\u002Fdiv>\n      <div class=\"s5-step-h\">Purposive<br>Sampling<\u002Fdiv>\n      <div class=\"s5-step-meta\">\n        <span class=\"k\">Python · NLTK<\u002Fspan><br>\n        <span class=\"k\">3,536<\u002Fspan> concordance lines\n      <\u002Fdiv>\n      <div class=\"s5-step-out\">BRIDGE<\u002Fdiv>\n      <div class=\"s5-step-n\">02<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"s5-arrow\">→<\u002Fdiv>\n    <div class=\"s5-step\">\n      <div class=\"s5-step-tag\">LEVEL · 03<\u002Fdiv>\n      <div class=\"s5-step-h\">Close<br>Reading<\u002Fdiv>\n      <div class=\"s5-step-meta\">\n        <span class=\"k\">Naming &amp; Enumeration<\u002Fspan><br>\n        <span class=\"k\">Responsibility Attribution<\u002Fspan><br>\n        <span class=\"k\">Urgency Metaphors<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"s5-step-out\">→ ANSWERS RQ 2<\u002Fdiv>\n      <div class=\"s5-step-n\">03<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"foot\"><span>Xuebei Hu · GSU<\u002Fspan><span>05 / 09<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════ S6: FIGURE 1 ═══════ -->\n<section class=\"s6\" data-screen-label=\"06 Figure 1\">\n  <div class=\"bg-layer\"><\u002Fdiv>\n  <div class=\"s6-head\">\n    <div>\n      <div class=\"redline\">Finding 1 · RQ 1<\u002Fdiv>\n      <div class=\"s6-title\">STRUCTURAL<br><span class=\"red\">PARADIGM<\u002Fspan> SHIFT<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"s6-stamp\">FIGURE · 1<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"s6-chart\"><div id=\"chart6\"><\u002Fdiv><\u002Fdiv>\n  <div class=\"s6-note\">Relative frequency per 10,000 words · medical paradigm peaks 2015 (≈256), logistics overtakes in the 2017—2021 transitional phase, reaches structural dominance post-2022.<\u002Fdiv>\n  <div class=\"foot\"><span>Xuebei Hu · GSU<\u002Fspan><span>06 / 09<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════ S7: TABLE 1 ═══════ -->\n<section class=\"s7\" data-screen-label=\"07 Table 1\">\n  <div class=\"bg-layer\"><\u002Fdiv>\n  <div class=\"s7-head\">\n    <div class=\"redline\">Finding 1 continued · Table 1<\u002Fdiv>\n    <div class=\"s7-title\">SEMANTIC <span class=\"red\">RUPTURE<\u002Fspan><br>AROUND \"FENTANYL\"<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"s7-cols\">\n    <div class=\"s7-col a\">\n      <div class=\"s7-col-tag\">EARLY · 2013 — 2016<\u002Fdiv>\n      <div class=\"s7-col-h\">Medical Cluster<\u002Fdiv>\n      <div class=\"s7-rank\" id=\"rank-early\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"s7-bridge\">\n      <div class=\"s7-bridge-lbl\">CO—OCCURRENCE<br>SHIFT<\u002Fdiv>\n      <div class=\"s7-bridge-arr\">→<\u002Fdiv>\n      <div class=\"s7-bridge-count\">3.7<span class=\"x\">×<\u002Fspan><\u002Fdiv>\n      <div class=\"s7-bridge-lbl\" style=\"color:var(--signal);\">\"deaths\" multiplies<br>43 → 161<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"s7-col b\">\n      <div class=\"s7-col-tag\">LATE · 2022 — 2025<\u002Fdiv>\n      <div class=\"s7-col-h\">Logistics Cluster<\u002Fdiv>\n      <div class=\"s7-rank\" id=\"rank-late\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"foot\"><span>Xuebei Hu · GSU<\u002Fspan><span>07 / 09<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════ S8: GLOBE + Three Operations (merged) ═══════ -->\n<section class=\"s8\" data-screen-label=\"08 Three Operations\">\n  <div class=\"s8-canvas-wrap\">\n    <canvas id=\"globeCanvas\" width=\"1240\" height=\"1080\"><\u002Fcanvas>\n  <\u002Fdiv>\n  <div class=\"s8-grid-overlay\"><\u002Fdiv>\n\n  <div id=\"globeLabels\">\n    <div class=\"globe-label\" data-node-id=\"china\" data-ox=\"16\" data-oy=\"-10\"><span class=\"t\">PRODUCTION<\u002Fspan>CHINA<\u002Fdiv>\n    <div class=\"globe-label\" data-node-id=\"india\" data-ox=\"16\" data-oy=\"10\"><span class=\"t\">PRODUCTION<\u002Fspan>INDIA<\u002Fdiv>\n    <div class=\"globe-label\" data-node-id=\"mexico\" data-ox=\"-180\" data-oy=\"-4\"><span class=\"t\">TRANSIT<\u002Fspan>MEXICO<\u002Fdiv>\n    <div class=\"globe-label\" data-node-id=\"sandiego\" data-ox=\"-210\" data-oy=\"-24\"><span class=\"t\">ENTRY<\u002Fspan>USA · WEST<\u002Fdiv>\n    <div class=\"globe-label\" data-node-id=\"elpaso\" data-ox=\"16\" data-oy=\"-22\"><span class=\"t\">ENTRY<\u002Fspan>USA · SW<\u002Fdiv>\n    <div class=\"globe-label\" data-node-id=\"laredo\" data-ox=\"16\" data-oy=\"18\"><span class=\"t\">ENTRY<\u002Fspan>USA · TX<\u002Fdiv>\n    <div class=\"globe-label\" data-node-id=\"dc\" data-ox=\"16\" data-oy=\"-8\"><span class=\"t\">DISTRIBUTION<\u002Fspan>USA · DC<\u002Fdiv>\n    <div class=\"globe-label\" data-node-id=\"hk\" data-ox=\"16\" data-oy=\"18\"><span class=\"t\">FINANCIAL<\u002Fspan>HK NODE<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"s8-legend\">\n    <div class=\"s8-legend-h\">GOVERNANCE NODES<\u002Fdiv>\n    <div class=\"s8-legend-row\"><span class=\"s8-legend-dot\" style=\"background:#d84527;\"><\u002Fspan>Production · Precursor<\u002Fdiv>\n    <div class=\"s8-legend-row\"><span class=\"s8-legend-dot\" style=\"background:#e0a83a;\"><\u002Fspan>Transit<\u002Fdiv>\n    <div class=\"s8-legend-row\"><span class=\"s8-legend-dot\" style=\"background:#e8c547;\"><\u002Fspan>Entry<\u002Fdiv>\n    <div class=\"s8-legend-row\"><span class=\"s8-legend-dot\" style=\"background:#3a7a8e;\"><\u002Fspan>Distribution<\u002Fdiv>\n    <div class=\"s8-legend-row\"><span class=\"s8-legend-dot\" style=\"background:#a873c6;\"><\u002Fspan>Financial<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"s8-hint\">Drag to rotate · discursively constructed topology<\u002Fdiv>\n\n  <div class=\"s8-panel\">\n    <div class=\"redline\">Finding 2 · RQ 2<\u002Fdiv>\n    <div class=\"s8-panel-title\">THREE<br><span class=\"red\">DISCURSIVE<\u002Fspan><br>OPERATIONS<\u002Fdiv>\n    <div class=\"s8-ops\">\n      <div class=\"s8-op\">\n        <div class=\"s8-op-n\">01<\u002Fdiv>\n        <div class=\"s8-op-t\">Naming &amp;<br>Enumeration<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"s8-op\">\n        <div class=\"s8-op-n\">02<\u002Fdiv>\n        <div class=\"s8-op-t\">Responsibility<br>Attribution<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"s8-op\">\n        <div class=\"s8-op-n\">03<\u002Fdiv>\n        <div class=\"s8-op-t\">Urgency<br>Metaphors<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════ S9: CONCLUSION · THEORETICAL ═══════ -->\n<section class=\"s9\" data-screen-label=\"09 Theoretical Contribution\">\n  <div class=\"bg-layer\"><\u002Fdiv>\n  <div class=\"s9-left\">\n    <div class=\"redline\" style=\"margin-bottom: 40px;\">Conclusion<\u002Fdiv>\n    <div class=\"s9-quote\">\n      Legitimation does not merely justify —<br><em>it creates the object.<\u002Fem>\n    <\u002Fdiv>\n    <div class=\"s9-quote-n\">\n      An object—constituting dimension of legitimation<br>\n      beyond Van Leeuwen (2007) · Vaara et al. (2024)\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"s9-right\">\n    <div class=\"redline\">Theoretical Contribution<\u002Fdiv>\n    <div class=\"s9-contrib-head\">EXTENDING<br><span class=\"red\">LEGITIMATION<\u002Fspan><br>THEORY.<\u002Fdiv>\n    <div class=\"s9-contrib\">\n      <div class=\"s9-c-tag\">MOVE · 01<\u002Fdiv>\n      <div class=\"s9-c-h\">Object Is Not Given<\u002Fdiv>\n      <div class=\"s9-c-b\">Van Leeuwen &amp; Vaara presuppose a <em>pre-given<\u002Fem> object of legitimation. Liminal infrastructure must first be <em>discursively assembled.<\u002Fem><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"s9-contrib\">\n      <div class=\"s9-c-tag\">MOVE · 02<\u002Fdiv>\n      <div class=\"s9-c-h\">Object-Constituting Work<\u002Fdiv>\n      <div class=\"s9-c-b\">Adds a new dimension to legitimation: the <em>prior discursive constitution<\u002Fem> of the governance object itself.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"s9-contrib\">\n      <div class=\"s9-c-tag\">MOVE · 03<\u002Fdiv>\n      <div class=\"s9-c-h\">Portable Framework<\u002Fdiv>\n      <div class=\"s9-c-b\">Applicable to any governance domain with <em>fluid, liminal<\u002Fem> objects — climate, finance, infrastructure.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"s9-thanks\">Thank You_<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdeck-stage>\n\n<script>\n/* ════════════════════════════════════════════════════\n   CHART — Figure 1 (crossover marker fixed)\n════════════════════════════════════════════════════ */\n(function() {\n  const el = document.getElementById('chart6');\n  if (!el) return;\n  const chart = echarts.init(el, null, { renderer: 'canvas', devicePixelRatio: 2 });\n\n  const years = ['2013','2014','2015','2016','2017','2018','2019','2020','2021','2022','2023','2024','2025'];\n  const medical   = [182, 96, 256, 226, 97, 62, 22, 24, 45, 41, 42, 17, 14];\n  const logistics = [121, 32, 26, 34, 67, 103, 125, 68, 72, 190, 148, 275, 141];\n\n  // Actual crossover: logistics exceeds medical from 2017 onward (67 > 97? no). \n  // Series values: 2017 med=97, log=67 still below.\n  // 2018 med=62, log=103 → crossover year is 2018.\n  // Let's mark 2017→2018 as the crossover visually.\n  \n  chart.setOption({\n    backgroundColor: 'transparent',\n    animationDuration: 1400,\n    textStyle: { fontFamily: 'Times New Roman, Times, serif' },\n    grid: { top: 90, right: 80, bottom: 90, left: 110 },\n    legend: {\n      data: ['MEDICAL / INDIVIDUAL PARADIGM', 'LOGISTICS / INFRASTRUCTURE PARADIGM'],\n      top: 10, left: 10,\n      textStyle: { color: '#f2ecd8', fontFamily: 'Times New Roman', fontSize: 24, fontStyle: 'italic', fontWeight: 'bold' },\n      itemGap: 50, itemWidth: 36, itemHeight: 5\n    },\n    tooltip: {\n      trigger: 'axis',\n      backgroundColor: '#14222b', borderColor: '#d84527', borderWidth: 2,\n      textStyle: { color: '#f2ecd8', fontSize: 22, fontFamily: 'Times New Roman' },\n      padding: 18\n    },\n    xAxis: {\n      type: 'category', data: years, boundaryGap: false,\n      axisLine: { lineStyle: { color: '#f2ecd8', opacity: 0.4, width: 2 } },\n      axisTick: { lineStyle: { color: '#f2ecd8', opacity: 0.4 } },\n      axisLabel: { color: '#f2ecd8', fontFamily: 'Times New Roman', fontSize: 24, fontWeight: 'bold' },\n      splitLine: { show: false }\n    },\n    yAxis: {\n      type: 'value', min: 0, max: 300,\n      name: 'Per 10,000 words', nameLocation: 'middle', nameGap: 70,\n      nameTextStyle: { color: '#f2ecd8', fontFamily: 'Times New Roman', fontSize: 24, fontStyle: 'italic', fontWeight: 'bold' },\n      axisLabel: { color: '#f2ecd8', fontFamily: 'Times New Roman', fontSize: 22, opacity: 0.75 },\n      splitLine: { lineStyle: { color: 'rgba(242,236,216,0.12)', type: 'dashed' } },\n      axisLine: { show: false }, axisTick: { show: false }\n    },\n    series: [\n      {\n        name: 'MEDICAL / INDIVIDUAL PARADIGM', type: 'line', smooth: 0.35,\n        data: medical,\n        lineStyle: { color: '#e0a83a', width: 5 },\n        itemStyle: { color: '#e0a83a', borderWidth: 3, borderColor: '#1b2e38' },\n        symbol: 'circle', symbolSize: 16,\n        areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1,\n          colorStops: [\n            { offset: 0, color: 'rgba(224,168,58,0.3)' },\n            { offset: 1, color: 'rgba(224,168,58,0)' }\n          ]}}\n      },\n      {\n        name: 'LOGISTICS / INFRASTRUCTURE PARADIGM', type: 'line', smooth: 0.35,\n        data: logistics,\n        lineStyle: { color: '#d84527', width: 7 },\n        itemStyle: { color: '#d84527', borderWidth: 3, borderColor: '#1b2e38' },\n        symbol: 'circle', symbolSize: 18,\n        areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1,\n          colorStops: [\n            { offset: 0, color: 'rgba(216,69,39,0.4)' },\n            { offset: 1, color: 'rgba(216,69,39,0)' }\n          ]}},\n        markPoint: {\n          data: [{ coord: ['2024', 275], value: 'PEAK 275' }],\n          symbolSize: 76,\n          itemStyle: { color: '#d84527', borderColor: '#f2ecd8', borderWidth: 3 },\n          label: { color: '#fff', fontFamily: 'Times New Roman', fontSize: 20, fontWeight: 'bold', fontStyle: 'italic' }\n        },\n        // Crossover happens at 2018 — logistics (103) > medical (62)\n        markLine: {\n          data: [{ xAxis: '2018', label: { formatter: 'CROSSOVER · 2018', color: '#d84527', fontFamily:'Times New Roman', fontSize: 24, fontWeight: 'bold', fontStyle: 'italic', position: 'insideEndTop', padding: [0, 6, 0, 6] }, lineStyle: { color: '#d84527', type: 'dashed', width: 3 } }],\n          symbol: 'none'\n        },\n        markArea: {\n          silent: true,\n          data: [[{ xAxis: '2017' }, { xAxis: '2021' }]],\n          itemStyle: { color: 'rgba(224,168,58,0.1)' },\n          label: { show: true, position: 'insideTop', formatter: 'TRANSITIONAL PHASE', color: '#e0a83a', fontFamily: 'Times New Roman', fontSize: 24, fontWeight: 'bold', fontStyle: 'italic' }\n        }\n      }\n    ]\n  });\n  window.addEventListener('resize', () => chart.resize());\n  setTimeout(() => chart.resize(), 400);\n})();\n\n/* ════════════════════════════════════════════════════\n   TABLE 1 — render ranked rows\n════════════════════════════════════════════════════ */\n(function() {\n  const early = [\n    ['deaths', 43], ['users', 27], ['use', 26], ['prescription', 23],\n    ['increase', 20], ['seized', 16], ['mexico', 15], ['times', 14],\n    ['manufactured', 14], ['china', 14], ['markets', 13], ['sold', 12],\n    ['adulterants', 12], ['pain', 12], ['dea', 12]\n  ];\n  const late = [\n    ['deaths', 161], ['trafficking', 154], ['cartels', 152], ['border', 148],\n    ['chemicals', 147], ['mexico', 130], ['dea', 126], ['people', 112],\n    ['precursor', 112], ['act', 109], ['china', 108], ['seized', 107],\n    ['crisis', 104], ['enforcement', 95], ['country', 93]\n  ];\n  const DEAD = new Set(['users', 'use', 'prescription', 'pain', 'markets', 'sold', 'adulterants', 'manufactured']);\n  const HOT  = new Set(['trafficking', 'cartels', 'border', 'chemicals', 'precursor', 'enforcement', 'crisis']);\n\n  function render(id, rows, side) {\n    const container = document.getElementById(id);\n    if (!container) return;\n    rows.forEach((r, i) => {\n      const row = document.createElement('div');\n      let cls = 's7-row';\n      if (side === 'a' && DEAD.has(r[0])) cls += ' dead a';\n      if (side === 'b' && HOT.has(r[0])) cls += ' hot b';\n      row.className = cls;\n      row.innerHTML = `\n        <span class=\"r\">${String(i+1).padStart(2,'0')}<\u002Fspan>\n        <span class=\"w\">${r[0]}<\u002Fspan>\n        <span class=\"f\">${r[1]}<\u002Fspan>`;\n      container.appendChild(row);\n    });\n  }\n\n  render('rank-early', early, 'a');\n  render('rank-late', late, 'b');\n})();\n\n/* ════════════════════════════════════════════════════\n   GLOBE\n════════════════════════════════════════════════════ */\n(function() {\n  let globe = null;\n  const canvas = document.getElementById('globeCanvas');\n  const labelContainer = document.getElementById('globeLabels');\n\n  function start() {\n    if (globe || !window.initGlobe) return;\n    globe = initGlobe(canvas, {\n      width: 1240, height: 1080,\n      labelContainer,\n      initialRotationY: -1.5,\n    });\n  }\n  setTimeout(start, 100);\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
